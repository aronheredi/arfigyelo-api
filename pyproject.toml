[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arfigyelo-api"
dynamic = ["version"]
description = "Python client for the Árfigyelő (arfigyelo.gvh.hu) price-comparison API."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Aron", email = "aronheredi346@gmail.com" }]
keywords = ["arfigyelo", "gvh", "prices", "hungary"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Pydantic :: 2",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.9",
]

[project.urls]
Homepage = "https://github.com/aronheredi/arfigyelo-api"
Repository = "https://github.com/aronheredi/arfigyelo-api"
Issues = "https://github.com/aronheredi/arfigyelo-api/issues"
"API map" = "https://arfigyelo.gvh.hu"

[dependency-groups]
dev = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pytest>=8",
    "pytest-asyncio>=1.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.hatch.version]
path = "src/arfigyelo_api/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/arfigyelo_api"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/README.md",
    "/API.md",
    "/CONTEXT.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
mypy_path = "src"
files = ["src"]
